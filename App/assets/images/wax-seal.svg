<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Wax surface lighting -->
    <radialGradient id="waxBase" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#c92a39"/>
      <stop offset="45%" stop-color="#991422"/>
      <stop offset="78%" stop-color="#690914"/>
      <stop offset="100%" stop-color="#42040c"/>
    </radialGradient>

    <!-- Inner stamped bed -->
    <radialGradient id="waxBed" cx="46%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#ab1b2b"/>
      <stop offset="65%" stop-color="#800f1c"/>
      <stop offset="90%" stop-color="#550710"/>
      <stop offset="100%" stop-color="#3d0309"/>
    </radialGradient>

    <!-- Gold star gradient -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="35%" stop-color="#e3be67"/>
      <stop offset="70%" stop-color="#9e7328"/>
      <stop offset="100%" stop-color="#6e4f17"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffe494"/>
      <stop offset="40%" stop-color="#c29b43"/>
      <stop offset="75%" stop-color="#7a5518"/>
      <stop offset="100%" stop-color="#47300c"/>
    </linearGradient>

    <!-- Specular rim highlight -->
    <linearGradient id="rimGloss" x1="20%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#ff7b88" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filter for realistic organic wax depth -->
    <filter id="waxShadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#140204" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="innerBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="-1.5" dy="-1.5" result="offset1"/>
      <feOffset dx="1.5" dy="1.5" result="offset2"/>
      <feComposite in="offset1" in2="offset2" operator="out" result="shadowDiff"/>
    </filter>
  </defs>

  <!-- Group with main shadow -->
  <g filter="url(#waxShadow)">
    <!-- Outer organic melted rim (irregular undulating wax boundary) -->
    <path d="M 80,10 
             C 98,9 114,14 126,27 
             C 137,38 148,51 149,67 
             C 151,85 145,102 135,116 
             C 124,131 110,144 92,148 
             C 74,151 57,147 43,138 
             C 27,128 15,116 11,98 
             C 8,80 13,64 21,49 
             C 30,32 46,19 63,13 
             C 68,11 74,10 80,10 Z" 
          fill="url(#waxBase)" />

    <!-- Organic melting lobes & ripples -->
    <path d="M 80,10 
             C 98,9 114,14 126,27 
             C 137,38 148,51 149,67 
             C 151,85 145,102 135,116 
             C 124,131 110,144 92,148 
             C 74,151 57,147 43,138 
             C 27,128 15,116 11,98 
             C 8,80 13,64 21,49 
             C 30,32 46,19 63,13 
             C 68,11 74,10 80,10 Z" 
          fill="url(#rimGloss)" 
          style="mix-blend-mode: overlay;" />

    <!-- Secondary melted lip highlight -->
    <path d="M 45,23 C 65,14 96,14 118,28 C 134,39 143,58 141,77 C 130,52 108,32 80,26 C 58,21 44,23 45,23 Z" 
          fill="#ff8e9b" opacity="0.3" filter="blur(2px)"/>

    <!-- Bottom crevice shadow on the wax rim -->
    <path d="M 28,110 C 44,136 78,148 108,140 C 128,135 139,122 142,108 C 132,126 108,138 82,136 C 54,134 35,123 28,110 Z" 
          fill="#2b0206" opacity="0.7" filter="blur(1.5px)"/>

    <!-- Inner stamped recessed bed -->
    <ellipse cx="80" cy="80" rx="44" ry="44" fill="#350408" opacity="0.8"/>
    <ellipse cx="80" cy="80" rx="42" ry="42" fill="url(#waxBed)"/>
    
    <!-- Recessed ring edge shadow/highlight -->
    <circle cx="80" cy="80" r="42" fill="none" stroke="#220205" stroke-width="2.5" opacity="0.85"/>
    <circle cx="80" cy="80" r="43.5" fill="none" stroke="#e04656" stroke-width="1.2" opacity="0.4" stroke-dasharray="80 180"/>

    <!-- Inner delicate stamp circle -->
    <circle cx="80" cy="80" r="34" fill="none" stroke="#750d18" stroke-width="1.2" opacity="0.7"/>

    <!-- 8-POINT COMPASS / STAR EMBOSSMENT (Gold faceted) -->
    <!-- Center coordinate: (80, 80) -->
    <!-- Primary vertical/horizontal rays: length 29px. Secondary diagonal rays: length 19px -->
    <g id="starOfDistinction">
      <!-- Shadow under gold star -->
      <g opacity="0.6" transform="translate(0, 1.5)">
        <polygon points="80,51 83,75 109,80 83,85 80,109 77,85 51,80 77,75" fill="#240205"/>
        <polygon points="80,61 82.5,76 99,80 82.5,84 80,99 77.5,84 61,80 77.5,76" fill="#240205" transform="rotate(45 80 80)"/>
      </g>

      <!-- DIAGONAL RAYS (Faceted) - rotated 45 deg -->
      <g transform="rotate(45 80 80)">
        <!-- North facet right -->
        <polygon points="80,61 80,80 83.5,77" fill="url(#goldLight)"/>
        <!-- North facet left -->
        <polygon points="80,61 80,80 76.5,77" fill="url(#goldDark)"/>
        <!-- South facet left -->
        <polygon points="80,99 80,80 76.5,83" fill="url(#goldLight)"/>
        <!-- South facet right -->
        <polygon points="80,99 80,80 83.5,83" fill="url(#goldDark)"/>
        <!-- East facet top -->
        <polygon points="99,80 80,80 83,76.5" fill="url(#goldLight)"/>
        <!-- East facet bottom -->
        <polygon points="99,80 80,80 83,83.5" fill="url(#goldDark)"/>
        <!-- West facet bottom -->
        <polygon points="61,80 80,80 77,83.5" fill="url(#goldLight)"/>
        <!-- West facet top -->
        <polygon points="61,80 80,80 77,76.5" fill="url(#goldDark)"/>
      </g>

      <!-- PRIMARY VERTICAL & HORIZONTAL RAYS (Faceted) -->
      <!-- North Point (80, 51) -->
      <polygon points="80,51 80,80 85,76" fill="url(#goldLight)"/>
      <polygon points="80,51 80,80 75,76" fill="url(#goldDark)"/>

      <!-- South Point (80, 109) -->
      <polygon points="80,109 80,80 75,84" fill="url(#goldLight)"/>
      <polygon points="80,109 80,80 85,84" fill="url(#goldDark)"/>

      <!-- East Point (109, 80) -->
      <polygon points="109,80 80,80 84,75" fill="url(#goldLight)"/>
      <polygon points="109,80 80,80 84,85" fill="url(#goldDark)"/>

      <!-- West Point (51, 80) -->
      <polygon points="51,80 80,80 76,85" fill="url(#goldLight)"/>
      <polygon points="51,80 80,80 76,75" fill="url(#goldDark)"/>

      <!-- Center raised gold bead -->
      <circle cx="80" cy="80" r="4.2" fill="url(#goldLight)"/>
      <circle cx="79.2" cy="79.2" r="3.2" fill="#ffeeb8"/>
      <circle cx="78.5" cy="78.5" r="1.2" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
