<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Debossed letterpress filter: inner shadow + subtle bottom highlight -->
    <filter id="debossEffect" x="-10%" y="-10%" width="120%" height="120%">
      <!-- Drop shadow for the debossed light rim (sunken effect) -->
      <feDropShadow dx="1" dy="1.5" stdDeviation="0.8" flood-color="#ffffff" flood-opacity="0.95"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="1" flood-color="#b8a892" flood-opacity="0.55"/>
    </filter>

    <linearGradient id="debossStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfbeaa"/>
      <stop offset="50%" stop-color="#dfcfbe"/>
      <stop offset="100%" stop-color="#c5b39e"/>
    </linearGradient>
  </defs>

  <g id="ornamentalFrame" filter="url(#debossEffect)" fill="none" stroke="url(#debossStroke)" stroke-linecap="round" stroke-linejoin="round">
    <!-- LEFT SIDE FLOURISHES -->
    <g id="leftBranch">
      <!-- Main outer curling stem -->
      <path d="M 500,480 C 420,490 310,480 240,420 C 180,370 160,280 200,200 C 230,140 310,110 360,140 C 390,160 390,200 360,220 C 320,240 280,210 290,180" stroke-width="2.2"/>
      
      <!-- Upper inward leaf scroll -->
      <path d="M 330,125 C 290,80 240,90 220,130 C 200,170 210,210 240,230" stroke-width="1.6"/>
      <path d="M 280,105 C 310,80 360,85 380,115" stroke-width="1.4"/>
      
      <!-- Acanthus leaf curves (left upper) -->
      <path d="M 230,170 C 190,150 170,180 160,210 C 150,250 170,290 200,320" stroke-width="1.8"/>
      <path d="M 180,195 C 150,190 130,220 140,250 C 150,280 180,290 190,270" stroke-width="1.4"/>
      <path d="M 155,235 C 130,240 120,270 130,295 C 140,320 170,330 190,310" stroke-width="1.3"/>

      <!-- Lower arch and bottom floral scroll -->
      <path d="M 210,340 C 170,380 190,440 250,455 C 310,470 390,460 450,480" stroke-width="2"/>
      <path d="M 240,380 C 210,410 220,440 260,435 C 300,430 320,390 300,370" stroke-width="1.4"/>
      <path d="M 280,440 C 330,470 390,465 440,490" stroke-width="1.7"/>
      <path d="M 360,465 C 390,495 430,495 470,490" stroke-width="1.5"/>

      <!-- Delicate leaf details & fills (left) -->
      <path d="M 245,215 C 235,200 250,190 265,200 C 275,210 260,225 245,215 Z" fill="#e8dacb" fill-opacity="0.45" stroke-width="1.2"/>
      <path d="M 175,270 C 160,260 170,245 185,250 C 195,255 190,275 175,270 Z" fill="#e8dacb" fill-opacity="0.45" stroke-width="1.2"/>
      <path d="M 215,315 C 200,305 210,290 225,295 C 235,300 230,320 215,315 Z" fill="#e8dacb" fill-opacity="0.45" stroke-width="1.2"/>
      <path d="M 260,410 C 245,400 255,385 270,390 C 280,395 275,415 260,410 Z" fill="#e8dacb" fill-opacity="0.45" stroke-width="1.2"/>
      <path d="M 330,445 C 320,430 335,420 348,430 C 355,440 345,455 330,445 Z" fill="#e8dacb" fill-opacity="0.45" stroke-width="1.2"/>

      <!-- Small budding florets -->
      <circle cx="215" cy="140" r="3.5" fill="#dfcfbe" stroke-width="1"/>
      <circle cx="150" cy="210" r="3" fill="#dfcfbe" stroke-width="1"/>
      <circle cx="135" cy="300" r="3.5" fill="#dfcfbe" stroke-width="1"/>
      <circle cx="210" cy="425" r="3" fill="#dfcfbe" stroke-width="1"/>
    </g>

    <!-- RIGHT SIDE FLOURISHES (Mirrored with organic natural variation) -->
    <g id="rightBranch" transform="translate(1000, 0) scale(-1, 1)">
      <!-- Main outer curling stem -->
      <path d="M 500,480 C 420,490 310,480 240,420 C 180,370 160,280 200,200 C 230,140 310,110 360,140 C 390,160 390,200 360,220 C 320,240 280,210 290,180" stroke-width="2.2"/>
      
      <!-- Upper inward leaf scroll -->
      <path d="M 330,125 C 290,80 240,90 220,130 C 200,170 210,210 240,230" stroke-width="1.6"/>
      <path d="M 280,105 C 310,80 360,85 380,115" stroke-width="1.4"/>
      
      <!-- Acanthus leaf curves (right upper) -->
      <path d="M 230,170 C 190,150 170,180 160,210 C 150,250 170,290 200,320" stroke-width="1.8"/>
      <path d="M 180,195 C 150,190 130,220 140,250 C 150,280 180,290 190,270" stroke-width="1.4"/>
      <path d="M 155,235 C 130,240 120,270 130,295 C 140,320 170,330 190,310" stroke-width="1.3"/>

      <!-- Lower arch and bottom floral scroll -->
      <path d="M 210,340 C 170,380 190,440 250,455 C 310,470 390,460 450,480" stroke-width="2"/>
      <path d="M 240,380 C 210,410 220,440 260,435 C 300,430 320,390 300,370" stroke-width="1.4"/>
      <path d="M 280,440 C 330,470 390,465 440,490" stroke-width="1.7"/>
      <path d="M 360,465 C 390,495 430,495 470,490" stroke-width="1.5"/>

      <!-- Leaf details & fills (right) -->
      <path d="M 245,215 C 235,200 250,190 265,200 C 275,210 260,225 245,215 Z" fill="#e8dacb" fill-opacity="0.45" stroke-width="1.2"/>
      <path d="M 175,270 C 160,260 170,245 185,250 C 195,255 190,275 175,270 Z" fill="#e8dacb" fill-opacity="0.45" stroke-width="1.2"/>
      <path d="M 215,315 C 200,305 210,290 225,295 C 235,300 230,320 215,315 Z" fill="#e8dacb" fill-opacity="0.45" stroke-width="1.2"/>
      <path d="M 260,410 C 245,400 255,385 270,390 C 280,395 275,415 260,410 Z" fill="#e8dacb" fill-opacity="0.45" stroke-width="1.2"/>
      <path d="M 330,445 C 320,430 335,420 348,430 C 355,440 345,455 330,445 Z" fill="#e8dacb" fill-opacity="0.45" stroke-width="1.2"/>

      <!-- Small florets -->
      <circle cx="215" cy="140" r="3.5" fill="#dfcfbe" stroke-width="1"/>
      <circle cx="150" cy="210" r="3" fill="#dfcfbe" stroke-width="1"/>
      <circle cx="135" cy="300" r="3.5" fill="#dfcfbe" stroke-width="1"/>
      <circle cx="210" cy="425" r="3" fill="#dfcfbe" stroke-width="1"/>
    </g>

    <!-- Center bottom flourish tie -->
    <path d="M 470,490 C 490,505 510,505 530,490 C 515,485 485,485 470,490 Z" fill="#e8dacb" fill-opacity="0.4" stroke-width="1.4"/>
  </g>
</svg>
